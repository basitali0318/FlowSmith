# One-click hosting on Render (free plan): New + > Blueprint > pick this repo.
# After the first deploy, open the service > Environment and paste GROQ_API_KEY.
services:
  - type: web
    name: flowsmith-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: flowsmith-db, property: connectionString }
databases:
  - name: flowsmith-db
    plan: free
    databaseName: flowsmith
    user: flowsmith
