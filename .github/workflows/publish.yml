# Publishes @basitali0318/flowsmith to GitHub Packages (npm registry).
# Run it from the Actions tab (workflow_dispatch) or by publishing a GitHub Release.
# Uses the built-in GITHUB_TOKEN - no personal access token needed.
name: Publish package
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@basitali0318'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Publish
        run: npm publish -w backend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
